name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Keep recordings and large artifacts out of Git
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          forbidden={'.wav','.ogg','.mp3','.flac','.m4a','.pt','.onnx','.safetensors','.npz','.pgdump'}
          assert not [p for p in files if p and (pathlib.Path(p).suffix.lower() in forbidden or pathlib.Path(p).name=='.env')]
          PY
